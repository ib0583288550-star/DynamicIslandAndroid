plugins { id 'com.android.application' }

android {
    namespace 'com.dynamicisland.android'
    compileSdk 35

    defaultConfig {
        applicationId 'com.dynamicisland.android'
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName '1.5'
    }

    buildTypes {
        release {
            // Temporary test signing only. Final Play distribution must use Play App Signing.
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }
}
