plugins { id 'com.android.application' }

android {
    namespace 'com.dynamicisland.android'
    compileSdk 35

    defaultConfig {
        applicationId 'com.dynamicisland.android'
        minSdk 26
        targetSdk 35
        versionCode 5
        versionName '1.4'
    }

    buildTypes {
        release {
            // Test-installable Release build; final Play upload will use a dedicated upload key.
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }
}
